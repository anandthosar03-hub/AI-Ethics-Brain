name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools and project
        run: |
          python -m pip install --upgrade setuptools wheel
          python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run safety benchmark smoke test
        run: python -m ethicsbrain.benchmark --out-dir reports/ci-benchmark
      - name: Run retrieval benchmark smoke test
        run: python -m ethicsbrain.retrieval_benchmark --out-dir reports/ci-retrieval
      - name: Validate sample policy
        run: python -m ethicsbrain.policy_cli validate configs/policy.example.json
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
